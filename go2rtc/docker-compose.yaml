services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    env_file:
      - ../.env
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    command: ["go2rtc", "-config", "/config/go2rtc.yaml"]
