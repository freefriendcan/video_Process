[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pipeline"
version = "0.2.0"
description = "Edge-AI vision pipeline for smart home — face tracking, gesture recognition, and fall detection on macOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["computer-vision", "smart-home", "face-recognition", "fall-detection", "edge-ai", "mediapipe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # Core CV
    "opencv-python>=4.8.0",
    "mediapipe==0.10.14",
    "numpy>=1.24.0",

    # TFLite Runtime (fall detection transformer)
    "ai-edge-litert>=2.1.0",

    # Streaming
    "websockets>=12.0",

    # HTTP client (agent communication)
    "requests>=2.31.0",

    # Config
    "python-dotenv>=1.0.0",

    # Future use (ByteTrack, on-device face recognition)
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "deepface>=0.0.80",
    "onnxruntime>=1.16.0,<1.24.0",
    "face-alignment>=1.4.0",
    "scikit-image>=0.21.0",

    # Utilities
    "pillow>=10.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/video_Process"
Repository = "https://github.com/yourusername/video_Process"

[tool.setuptools]
py-modules = ["config", "main", "mac_camera"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "capture*",
    "detection*",
    "events*",
    "identification*",
    "quality*",
    "streaming*",
    "tracking*",
]
exclude = ["data*", "go2rtc*", "scripts*", "tests*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
